services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    tty: true
    stdin_open: true

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - /opt/anonimki-bot/.env
    volumes:
      - /opt/anonimki-data:/app/data
    depends_on:
      - redis
    tty: true
    stdin_open: true
